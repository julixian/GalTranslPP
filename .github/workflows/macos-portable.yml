name: macOS libc++ portable

on:
  push:
    branches: [codex/macos-libcxx]
  workflow_dispatch:
    inputs:
      source_run:
        description: '复用已有构建产物的运行 ID；留空则重新编译'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.source_run == ''
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.mcpp
            ~/.cache/vcpkg/archives
            target/macos-tools
          key: macos-arm64-${{ hashFiles('mcpp-build-scripts/macos/build-macos.toml', 'vcpkg.json', 'vcpkg-scripts/ports/**') }}
          restore-keys: |
            macos-arm64-${{ hashFiles('mcpp-build-scripts/macos/build-macos.toml', 'vcpkg.json', 'vcpkg-scripts/ports/**') }}-
            macos-arm64-
      - name: Prepare SDK and native dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p target/macos-logs
          python -u mcpp-build-scripts/macos/build-macos.py --prepare-only 2>&1 | tee target/macos-logs/prepare.log
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.mcpp
            ~/.cache/vcpkg/archives
            target/macos-tools
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Compile and package application
        id: application
        run: |
          set -o pipefail
          python -u mcpp-build-scripts/macos/build-macos.py --build-only 2>&1 | tee target/macos-logs/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-native-build-logs
          path: |
            target/macos-logs/**
            target/**/resolution.json
            target/**/build.ninja
          if-no-files-found: warn
      - name: Test portable Python and application
        run: python mcpp-build-scripts/macos/check-macos-portable.py Release/GalTranslPP-macos-arm64 --optional-dependencies
      - name: Test Python independently when build fails
        if: failure() && steps.application.outcome == 'failure'
        run: |
          if [ -x target/macos-tools/python/bin/python3 ]; then
            python mcpp-build-scripts/macos/check-macos-portable.py --python-root target/macos-tools/python --optional-dependencies
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GalTranslPP-macos-arm64
          path: |
            Release/*.tar.gz
            Release/*.dmg
            Release/*report*.json
            Release/*.png
            target/macos-logs/**
            vcpkg_installed/**/vcpkg/issue_body.md
          if-no-files-found: warn

  dmg:
    if: inputs.source_run != ''
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: GalTranslPP-macos-arm64
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: target/macos-source
      - name: Unpack application
        run: |
          mkdir -p Release target/macos-logs
          tar -xzf target/macos-source/Release/GalTranslPP-macos-arm64.tar.gz -C Release
          cp -R Example/BaseConfig/PythonScripts/. Release/GalTranslPP-macos-arm64/GalTranslPP.app/Contents/MacOS/BaseConfig/PythonScripts/
          cp -R Example/BaseConfig/illustration/. Release/GalTranslPP-macos-arm64/GalTranslPP.app/Contents/MacOS/BaseConfig/illustration/
      - name: Sign application bundle
        run: python -u mcpp-build-scripts/macos/sign-macos.py Release/GalTranslPP-macos-arm64/GalTranslPP.app
      - name: Test compatible BabelDOC installation
        run: python -u mcpp-build-scripts/macos/check-macos-portable.py --python-root Release/GalTranslPP-macos-arm64/GalTranslPP.app/Contents/MacOS/BaseConfig/Python --optional-dependencies babeldoc
      - name: Create and test DMG
        run: |
          set -o pipefail
          python -u mcpp-build-scripts/macos/make-dmg.py Release/GalTranslPP-macos-arm64 --check 2>&1 | tee target/macos-logs/dmg.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPPGUI-macos-arm64-DMG
          path: |
            Release/*.dmg
            Release/*report*.json
            Release/*.png
            target/macos-logs/**
          if-no-files-found: warn
