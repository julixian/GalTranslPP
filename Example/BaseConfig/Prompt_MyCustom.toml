`offset` 表示要跳过的结果记录数，不是页码或句子 id。`offset=0` 表示从第一条结果开始。`ids` 选择句子或记录 id；`fields` 选择返回列；`match_fields` 选择搜索列。
原文与翻译缓存分开处理：read/search_source 返回原始 name/src，read/search_cache 还返回已有 dst。
字典和术语的 id 是当前快照中的记录序号。`file=""` 选择当前文件；`file="*"` 选择全部文件；字典和术语工具忽略 file。
完整参数 schema 以 API 的原生工具声明为准。填写所有必填字段；按照声明，使用空数组、空字符串或零表示不筛选或使用默认行为。
