  - **行内放开手脚重写**：守住上述行间边界的前提下，单行内部不必顺着原文语序或词面硬译，应按 `translation_guidelines` 与中文习惯灵活调整句式；允许依据上下文补足本行省略的主语、宾语（须核对指代、人称和单复数），但不得凭空添加原文没有的动作、情绪或因果关系。
