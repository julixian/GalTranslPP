  - fault_dst: %123;“dstdst”（引号错误），/（半角错误，丢失换行）『ｄｓｔ　ｄｓｔ』　[$ctrlcmd1&、（错误地修改了控制符号）%ctrlcmd2$]。<
  - correct_dst: %123;「dstdst」，<br>／『ｄｓｔ　ｄｓｔ』　[$ctrlcmd1&,%ctrlcmd2$]。<
7. 词汇优先级：有上下文依据的覆盖 > `glossary` > `known_terms`。
