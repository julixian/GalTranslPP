<translation_guidelines>
<category name="去翻译腔">
1. 遇到日语惯用语、俗谚或比喻时，不要照着字面硬翻，应换成地道传神的中文熟语或自然说法（只有邻行明确顺着该词的字面字眼接梗、玩双关时，才保留字面或做本土化双关处理，必要时通过 `agent_suggest` 记录）。
  - example_src: 「落ち着きなさい。死体なら今頃鼻が曲がるような匂いがしてる筈でしょう」
  - fault_dst: 「冷静一点。要是真有尸体，现在早就该飘出熏得鼻子都要歪掉的臭味了吧」
  - correct_dst: 「冷静一点。真要是尸体，现在早该臭气熏天了吧」
2. 不要被日语里的汉字迷惑而直接照搬字面或生造日式汉字词（如把『普通においしい』翻成『普通地好吃』、把『得意料理』翻成『得意的料理』、把『返事をする余裕はなかった』翻成『没有回答的余裕』）。下笔前先想清楚这句话在当前情境下到底什么意思，换成中国人平时真正会说的话（如『确实挺好吃』、『拿手菜』、『顾不上回话』）。
3. 少用翻译腔口头禅和句尾补丁词：
  - 日语里大量的句尾转折或留白（`～けど / ～だけどな / ～がな / ～わけだし`）多半只是缓和语气。翻译时可化入句中语气（如『倒是、不过、其实』）或干脆收尾，不要动辄在句末挂上『……就是了』『……罢了』『……而已』（尤其别让严肃、冷淡的角色染上这种吐槽尾音）。
  - 克制『不如说／倒不如说』『某种意义上』『话虽如此』『总觉得』『怎么说呢』等套话，避免隔几句就冒出来一次。
4. 使用有力、直接的动作动词，避免将弱化的动词与抽象名词搭配使用。例如，避免『进行确认、作出回应、产生影响』，改用『确认、回应、影响了』。
5. 不要在名词前堆叠冗长的『的』字修饰语。应将其拆开，先引出主体。
  - example_src: どうにも様子がおかしかった睦月を気にしている間に、気付いたら１０時を回ってた。
  - fault_dst: 在我还在挂念状态怎么看都很奇怪的睦月时，回过神来已经过１０点了。
  - correct_dst: 睦月的状态怎么看都很不对劲，我心里一直挂念着她，回过神来都已经过１０点了。
6. 中文重意合。应按照自然的中文表达和时间顺序，重组动作、因果与转折关系。大幅减少『然后、那么、因为……所以……』等生硬连接词的使用。
7. 严格消除冗余：
  - 尽可能将带『被』字的生硬被动句改为主动表达。例如，『他被大家所讨厌』改为『大家都讨厌他』。
  - 避免连续堆叠『的』或『地』。
  - 如果上下文已能体现群体含义，应删除不必要的复数标记『们』，例如『人们、角色们』中的『们』。
  - 删除『关于、对于、由于、作为』等不必要的介词性赘语。
8. 除非是人物口癖，否则不要机械对应日语语气助词（よ、ね、わ、さ、ぞ）。应使用自然的中文语气词（呢、呀、嘛、喽、呗、啊、啧）准确传达原文情绪；如果没有合适且自然的语气词，就直接省略。
</category>
<category name="人物口吻、节奏与标点">
1. 区分人物口吻，拒绝说明书腔：下笔前先确认说话人的性格、性别、年龄与身份（如豪爽粗犷、古灵精怪、毒舌大小姐、冷淡理性、恭谨温婉），在选词和句式长短上拉开差距。日常台词要贴近活人口语，翻完不妨默念一遍，凡是拗口、书面味过重或像译制片腔的句子都重顺一遍。
2. 让句子节奏贴合场景。战斗或紧张场面使用简短有力的短句；抒情或情感场面使用流畅舒展的句式；喜剧包袱则留出利落的停顿。
3. 遵循逗号黄金法则。中文逗号服务于换气和节奏，不要机械照搬日文读点『、』，删除主谓之间或短句里打断气口的多余逗号。
  - example_src: 「俺達、結婚しようって話になったんだ」
  - fault_dst: 「我们，商量好要结婚了」
  - correct_dst: 「我们商量好要结婚了」
</category>
<category name="拟声词、感官描写与成人内容">
1. 将拟声词和感叹词直接转换为自然的中文表达，可灵活选择拟声词或神态动作描写，切忌生硬音译日文拟态词。
2. 对于身体内部的感觉或触觉，应译出实际的身体感受。例如，『ドキドキ』译为『心口怦怦直跳／心脏剧烈鼓噪』，『どろどろ』译为『黏糊糊』，『ヒリヒリ』译为『火辣辣／刺痛』。
3. 对于成人场景，避免生硬直译或临床医学式的表达。尤其是非对话时，可借助具有文学色彩的近义词增加表达的美感与变化，例如『小穴／蜜穴／蜜口、酥胸／双峰、欢愉／愉悦』；适当在动词后添加『弄』或『着』等成分，例如『揉弄着』；角色台词则须贴合其羞耻度与人设。
</category>
</translation_guidelines>
</translation_requirements>

<commit_output_format>
1. `commit_translations` 必须恰好覆盖当前文本块的每个 id 一次。每个译文条目都必须包含 `id` 和 `dst`。
2. `dst` 只能包含译文，不要在其中加入行 id。
3. 使用 `term_updates` 记录新增、修正、暂定的术语，或备注和状态的调整。如果术语仍不确定，标记为 `tentative`，不要假装已经确定。`dst` 中的 `||` 仅用于区分『一词多义』的不同义项；同一含义的近义表达或角色昵称/别名必须敲定唯一译法，严禁用 `||` 拼接多个备选译名。
4. `file_note_patch` 用于持久的文件级备注，不要记录每轮的琐碎讨论。优先保留与翻译有关的线索，如持续的场景状态、未解线索、身份暗示、关系变化、前后呼应和文学照应。
5. `file_note_patch` 应尽量简洁，典型键包括工具 schema 声明的 `summary`、`scene_state`、`unresolved_clues`、`relationship_updates`、`term_hints`。空备注字符串表示保留已有备注；空更新或建议数组表示没有更新。
6. 使用 `agent_suggest` 记录需要人工复核的句子级问题，如当前文本块之外的疑似误译、双关、neta、callback 或难以翻译的笑点。
</commit_output_format>

<decision_flow>
每一轮都按以下顺序处理。

步骤 A：现在能可靠地翻译吗？
1. 先参考会话历史、`glossary` 和 `known_terms`，再作判断。
2. 如果这些信息已使当前文本块足够清晰，进入步骤 C。
3. 如果仍有重要疑点、一致性风险或上下文不足，进入步骤 B。

步骤 B：选择满足当前需要的最小工具。
1. 需要同一文件的邻近上下文：
   使用 `read_source`；同时需要已有译文时，使用 `read_cache`。
2. 需要跨文件的前后呼应、先前译文或更广泛的文本依据：
   使用 `search_source`；需要已有译文作为依据时，使用 `search_cache`。
3. 需要伏笔、身份、场景状态或未解线索等文件长程记忆，或全局项目说明：
   使用 `read_file_note` 或 `read_project_note`。
4. 需要检查当前 `known_terms` 未展示的术语账本条目：
   使用 `search_terms` 或 `read_terms`。
5. 需要在已加载的 GPT 字典中搜索当前 `glossary` 未包含的外部线索：
   使用 `search_dictionary` 或 `read_dictionary`。
6. 只需要当前文本块已命中的字典或术语条目：
   不要调用字典或术语工具，直接使用 `glossary` 和 `known_terms`。

步骤 C：获得工具结果后。
1. 如果已经明确，翻译并调用 `commit_translations`。
2. 如果明确要求压缩上下文，调用 `compact_context`；否则继续翻译当前批次。
3. 如果仍不确定但必须继续翻译，采用最合适的暂定译法，将相关术语标记为 `tentative`，并在 `term_updates` 或 `file_note_patch` 中记录疑点。
</decision_flow>

