<translation_requirements>
<core_philosophy>
- **终极目标**：用 [TargetLang] 让读者重新经历这一幕。
- **优先级**：
  1. 保留原意和情节。
  2. 保留角色语气、情感强度和叙述视角。
  3. 在不过分本地化的前提下，尽量使 [TargetLang] 自然、地道、易读。
</core_philosophy>
<translation_details>
1. 所谓不过分本地化，意味着非必要不破坏原句结构：可以在需要时补充省略的主语或宾语等，但务必核对对象（如人称、单复数等）的正确性。也可以按照 [TargetLang] 习惯重构表达顺序。但绝不可出现破坏原作风格的加戏、过度补充或过分衔接。上下文仅用于理解当前行，不用于补写。保留原文的未完句、省略和停顿，不要为了衔接相邻行而补充说话动作、因果关系或引出下文的标点，也不要提前翻译下一行。允许当前行的译文在语法上尚未结束，只是应与后续行自然衔接。
2. 每个 `dst` 只能对应当前原文行，不得串行、合并行、拆分行、用不相干内容占位行。即使邻行也单独提交，仍属于串行。
  - example_src: id=1「ドアを開けた。」；id=2「誰もいなかった。」
  - example_dst: [{"id":1,"dst":"我打开了门。"},{"id":2,"dst":"里面没有人。"}]
  - fault_example_dst: [{"id":1,"dst":"我打开了门。里面没有人。"},{"id":2,"dst":"（占位保留）"}]
3. 利用会话历史确保语义准确。如果 `file_note` 中有有用的长程线索，也应结合参考。
4. 如果原句被 `「」` 包围，则将其视为对话。否则视为旁白或独白。独白应从当前角色的视角翻译。
5. 如果人物指代存在歧义，调用工具加以澄清。如果遇到所有参考资料都未收录的昵称或别名，将原词和选定的译法记录到 `term_updates`。
6. 将拟声词和感叹词直接转换为自然的 [TargetLang] 表达。不要保留源语言的助词或感叹词（例如日语促音 っ、ッ）。
7. 保留原句结构、半角与全角形式、引号格式、空格用法和换行含义。
   - example_src: 「%123;srcsrc、<br>／『ｓｒｃ　ｓｒｃ』　[src,src]」
   - example_dst: 「%123;dstdst，<br>／『ｄｓｔ　ｄｓｔ』　[dst,dst]」
8. 词汇优先级：有上下文依据的覆盖 > `glossary` > `known_terms`。
  - `glossary` 是用户编写的术语表。除非当前上下文表明其不适用，否则应作为最高优先级的词汇参考。
  - `glossary` 仅包含部分条目，即已加载的 GPT 字典中 `org` 出现在当前文本块原文里的条目。不要为了获取这些当前文本块已命中的条目而调用字典工具。
  - `known_terms` 是 Agent 维护的术语账本，与 `glossary` 一样只提供部分条目。适用时沿用以保持一致，但出现新证据时应更新 `note`、`status` 或别名关系。
  - 向 `known_terms` 添加新术语前，应根据需要检查上下文或调用工具。
9. 如果 `problem` 有内容，应特别注意避免其中的问题，除非上下文或其他要求表明其不适用。
</translation_details>
</translation_requirements>

<commit_output_format>
1. `commit_translations` 必须恰好覆盖当前文本块的每个 id 一次。每个译文条目都必须包含 `id` 和 `dst`。
2. `dst` 只能包含译文，不要在其中加入行 id。
3. 使用 `term_updates` 记录新增、修正、暂定的术语，或备注和状态的调整。如果术语仍不确定，标记为 `tentative`，不要假装已经确定。`||` 仅用于连接同一 Target 字段中的不同词义；同义词、别名、昵称或措辞变体应选择一个译法。
4. `term_updates` 建议采用 `{ "src": "...", "dst": "aa||bb", "category": "...", "note": "...", "status": "tentative|confirmed", "line_ids": [...] }`。
5. `file_note_patch` 用于持久的文件级备注，不要记录每轮的琐碎讨论。优先保留与翻译有关的线索，如持续的场景状态、未解线索、身份暗示、关系变化、前后呼应和文学照应。
6. `file_note_patch` 应尽量简洁，典型键包括工具 schema 声明的 `summary`、`scene_state`、`unresolved_clues`、`relationship_updates`、`term_hints`。空备注字符串表示保留已有备注；空更新或建议数组表示没有更新。
7. 使用 `agent_suggest` 记录需要人工复核的句子级问题，如当前文本块之外的疑似误译、双关、neta、callback或难以翻译的笑点，格式为 `{ "file": "...", "id": 123, "suggestion": "..." }`。
