<translation_guidelines>
<category name="去翻译腔">
1. 使用有力、直接的动作动词，避免将弱化的动词与抽象名词搭配使用。例如，避免“进行确认、作出回应、产生影响”，改用“确认、回应、影响了”。
2. 不要在名词前堆叠冗长的修饰语。应将其拆开，先引出主体。
  - example_src: どうにも様子がおかしかった睦月を気にしている間に、気付いたら１０時を回ってた。
  - fault_dst: 在我还在挂念状态怎么看都很奇怪的睦月时，回过神来已经过１０点了。
  - correct_dst: 睦月的状态怎么看都很不对劲，我心里一直挂念着她，回过神来都已经过１０点了。
3. 中文重意合。应按照自然的中文表达和时间顺序，重组动作、因果与转折关系。大幅减少“然后、那么、因为……所以……”等生硬连接词的使用。
4. 严格消除冗余：
  - 尽可能将带“被”字的被动表达改为主动表达。例如，“他被大家所讨厌”改为“大家都讨厌他”。
  - 避免连续堆叠“的”或“地”。
  - 如果上下文已能体现群体含义，应删除不必要的复数标记“们”，例如“人们、角色们”中的“们”。
  - 删除“关于、对于、由于、作为”等不必要的介词性赘语。
5. 除非是人物口癖，否则不要机械对应日语语气助词（よ、ね、わ、さ、ぞ）。应使用自然的中文语气词（呢、呀、嘛、呗、啊、啧），准确传达原文的情绪。如果没有合适且自然的语气词，就直接省略。
6. 普通对话应贴近日常口语。不应使用过于正式、生硬或让句子看起来像说明书的词汇或短语。
</category>
<category name="节奏、动作与标点">
1. 让句子节奏贴合场景。战斗或紧张场面使用简短有力的动词；抒情或情感场面使用流畅舒展的句式；喜剧包袱则应安排适当的停顿。
2. 遵循逗号黄金法则。中文逗号服务于换气和节奏，不应拘泥于语法划分。删除不必要的逗号。
  - example_src: 「俺達、結婚しようって話になったんだ」
  - fault_dst: 「我们，商量好要结婚了」
  - correct_dst: 「我们商量好要结婚了」
</category>
<category name="拟声词、感官描写与成人内容">
1. 将拟声词和感叹词直接转换为自然的 [TargetLang] 表达。可灵活选择音译或通过动作描述来呈现。
2. 对于身体内部的感觉或触觉，应译出实际的身体感受。例如，“ドキドキ”译为“心脏剧烈鼓噪”，“どろどろ”译为“黏糊糊”，“ヒリ”译为“火辣辣/刺痛”。
3. 对于成人场景，避免生硬直译或临床医学式的表达。尤其是非对话时，可借助具有文学色彩的近义词，增加表达的美感与变化，例如“小穴/蜜穴/蜜口、酥胸/双峰、欢愉/愉悦”。适当在动词后添加“弄”或“着”等成分，例如“揉弄着”。
</category>
</translation_guidelines>
