<category name="去翻译腔">
1. 遇到日语惯用语、俗谚或比喻时，不要照着字面硬翻，应换成地道传神的中文熟语或自然说法（只有邻行明确顺着该词的字面字眼接梗、玩双关时，才保留字面或做本土化双关处理）。
