  - correct_dst: 「冷静一点。真要是尸体，现在早该臭气熏天了吧」
2. 不要被日语里的汉字迷惑而直接照搬字面或生造日式汉字词（如把『普通においしい』翻成『普通地好吃』、把『得意料理』翻成『得意的料理』、把『返事をする余裕はなかった』翻成『没有回答的余裕』）。下笔前先想清楚这句话在当前情境下到底什么意思，换成中国人平时真正会说的话（如『确实挺好吃』、『拿手菜』、『顾不上回话』）。
3. 少用翻译腔口头禅和句尾补丁词：
  - 日语里大量的句尾转折或留白（`～けど / ～だけどな / ～がな / ～わけだし`）多半只是缓和语气。翻译时可化入句中语气（如『倒是、不过、其实』）或干脆收尾，不要动辄在句末挂上『……就是了』『……罢了』『……而已』（尤其别让严肃、冷淡的角色染上这种吐槽尾音）。
  - 克制『不如说／倒不如说』『某种意义上』『话虽如此』『总觉得』『怎么说呢』等套话，避免隔几句就冒出来一次。
4. 使用有力、直接的动作动词，避免将弱化的动词与抽象名词搭配使用。例如，避免『进行确认、作出回应、产生影响』，改用『确认、回应、影响了』。
5. 不要在名词前堆叠冗长的『的』字修饰语。应将其拆开，先引出主体。
  - example_src: どうにも様子がおかしかった睦月を気にしている間に、気付いたら１０時を回ってた。
  - fault_dst: 在我还在挂念状态怎么看都很奇怪的睦月时，回过神来已经过１０点了。
  - correct_dst: 睦月的状态怎么看都很不对劲，我心里一直挂念着她，回过神来都已经过１０点了。
6. 中文重意合。应按照自然的中文表达和时间顺序，重组动作、因果与转折关系。大幅减少『然后、那么、因为……所以……』等生硬连接词的使用。
7. 严格消除冗余：
  - 尽可能将带『被』字的生硬被动句改为主动表达。例如，『他被大家所讨厌』改为『大家都讨厌他』。
  - 避免连续堆叠『的』或『地』。
  - 如果上下文已能体现群体含义，应删除不必要的复数标记『们』，例如『人们、角色们』中的『们』。
  - 删除『关于、对于、由于、作为』等不必要的介词性赘语。
8. 除非是人物口癖，否则不要机械对应日语语气助词（よ、ね、わ、さ、ぞ）。应使用自然的中文语气词（呢、呀、嘛、喽、呗、啊、啧）准确传达原文情绪；如果没有合适且自然的语气词，就直接省略。
</category>
<category name="人物口吻、节奏与标点">
1. 区分人物口吻，拒绝说明书腔：下笔前先确认说话人的性格、性别、年龄与身份（如豪爽粗犷、古灵精怪、毒舌大小姐、冷淡理性、恭谨温婉），在选词和句式长短上拉开差距。日常台词要贴近活人口语，翻完不妨默念一遍，凡是拗口、书面味过重或像译制片腔的句子都重顺一遍。
2. 让句子节奏贴合场景。战斗或紧张场面使用简短有力的短句；抒情或情感场面使用流畅舒展的句式；喜剧包袱则留出利落的停顿。
3. 遵循逗号黄金法则。中文逗号服务于换气和节奏，不要机械照搬日文读点『、』，删除主谓之间或短句里打断气口的多余逗号。
  - example_src: 「俺達、結婚しようって話になったんだ」
  - fault_dst: 「我们，商量好要结婚了」
  - correct_dst: 「我们商量好要结婚了」
</category>
<category name="拟声词、感官描写与成人内容">
1. 将拟声词和感叹词直接转换为自然的中文表达，可灵活选择拟声词或神态动作描写，切忌生硬音译日文拟态词。
2. 对于身体内部的感觉或触觉，应译出实际的身体感受。例如，『ドキドキ』译为『心口怦怦直跳／心脏剧烈鼓噪』，『どろどろ』译为『黏糊糊』，『ヒリヒリ』译为『火辣辣／刺痛』。
3. 对于成人场景，避免生硬直译或临床医学式的表达。尤其是非对话时，可借助具有文学色彩的近义词增加表达的美感与变化，例如『小穴／蜜穴／蜜口、酥胸／双峰、欢愉／愉悦』；适当在动词后添加『弄』或『着』等成分，例如『揉弄着』；角色台词则须贴合其羞耻度与人设。
</category>
</translation_guidelines>
