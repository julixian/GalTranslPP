[package]
namespace = "gpp"
name = "gui"

[dependencies]
"gpp.core" = { path = "../GalTranslPP" }
"gpp.version" = { path = "../GPPVersion" }

[build-dependencies]
"gpp.build" = { path = "../mcpp-build-scripts/gpp-build", host-module = true }
"gpp.updater" = { path = "../Updater", tools = ["Updater"] }

[target.windows.build-dependencies]
"gpp.runtime-stage" = { path = "../mcpp-build-scripts/runtime-stage", tools = ["runtime_stage"] }

[profile.release]
opt = 3
debug = true
lto = true

[profile.fast-release]
opt = 0
debug = true
lto = false

[build]
# 当前 Windows / Clang 构建统一使用动态 CRT；此参数必须同时传给 import std。
dialect_cxxflags = ["-fms-runtime-lib=dll"]
default-profile = "release"
sources = ["**/*.cpp", "**/*.c", "!GPPGUI.cpp", "!mcpp-generated/**"]
include_dirs = [
  ".",
  "../GalTranslPP",
  "../3rdParty/pybind11/include"
]

[target.windows.build]
include_dirs = ["../3rdParty/pybind11/Python/include"]
defines = ["WIN32_LEAN_AND_MEAN", "NOMINMAX", "_CRT_SECURE_NO_WARNINGS", "SPDLOG_WCHAR_FILENAMES", "_RANGES_"]
ldflags = ["-ldbghelp"]

[targets.GalTranslPP_GUI]
kind = "bin"
main = "GPPGUI.cpp"
windows_subsystem = "windows"

[resources]
files = ["GPPGUI.rc"]
extra-inputs = ["GPPGUI.manifest", "Resource/images/julixian_s.ico"]
