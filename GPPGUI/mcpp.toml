[package]
namespace = "julixian"
name = "gpp-gui"

[dependencies]
julixian.gpp-core = { path = "../GalTranslPP" }
julixian.gpp-version = { path = "../GPPVersion" }
julixian.gpp-updater = { path = "../Updater", artifacts = ["Updater"] }
julixian.tomlkitpp = { path = "../3rdParty/tomlkitpp/tomlkitpp" }

[build-dependencies]
julixian.gpp-build = { path = "../mcpp-build-scripts/gpp-build" }

[target.windows.build-dependencies]
julixian.gpp-vcpkg-link-libs = { path = "../mcpp-build-scripts/vcpkg-link-libs", tools = ["vcpkg-link-libs"] }
julixian.gpp-runtime-stage = { path = "../mcpp-build-scripts/runtime-stage", tools = ["runtime-stage"] }

[build]
default-profile = "release"
sources = [
  "*.cpp",
  "TreeSitterGrammars/**/*.c",
  "!GPPGUI.cpp",
  "!x64/**",
  "!x86/**"
]

[target.windows.build]
ldflags = ["-ldbghelp"]

[resources]
files = ["GPPGUI.rc"]

[targets.GalTranslPP_GUI]
kind = "bin"
main = "GPPGUI.cpp"
windows_subsystem = "windows"
