[package]
namespace = "gpp"
name = "gui"

[dependencies]
"gpp.core" = { path = "../GalTranslPP" }
"gpp.version" = { path = "../GPPVersion" }
"gpp.updater" = { path = "../Updater", artifacts = ["Updater"] }

[build-dependencies]
"gpp.build" = { path = "../mcpp-build-scripts/gpp-build", host-module = true }

[target.windows.build-dependencies]
"gpp.vcpkg-link-libs" = { path = "../mcpp-build-scripts/vcpkg-link-libs", tools = ["vcpkg-link-libs"] }
"gpp.runtime-stage" = { path = "../mcpp-build-scripts/runtime-stage", tools = ["runtime-stage"] }

[build]
default-profile = "release"
sources = [
  "*.cpp",
  "TreeSitterGrammars/**/*.c",
  "!GPPGUI.cpp",
  "!x64/**",
  "!x86/**"
]

[target.windows.build]
ldflags = ["-ldbghelp"]

[resources]
files = ["GPPGUI.rc"]

[targets.GalTranslPP_GUI]
kind = "bin"
main = "GPPGUI.cpp"
windows_subsystem = "windows"
