[package]
namespace = "gpp"
name = "version"

[profile.release]
opt = 3
debug = true
lto = true

[profile.fast-release]
opt = 0
debug = true
lto = false

[build]
# 当前 Windows / Clang 构建统一使用动态 CRT；此参数必须同时传给 import std。
dialect_cxxflags = ["-fms-runtime-lib=dll"]
default-profile = "release"
sources = ["GPPVersion.ixx"]
module_extensions = [".ixx"]

[target.windows.build]
defines = ["WIN32_LEAN_AND_MEAN", "NOMINMAX", "_CRT_SECURE_NO_WARNINGS", "SPDLOG_WCHAR_FILENAMES", "_RANGES_"]

[targets.GPPVersion]
kind = "lib"
