[package]
namespace = "gpp"
name = "updater"

[dependencies]
"gpp.version" = { path = "../GPPVersion" }

[build-dependencies]
"gpp.build" = { path = "../mcpp-build-scripts/gpp-build", host-module = true }

[target.windows.build-dependencies]
"gpp.vcpkg-link-libs" = { path = "../mcpp-build-scripts/vcpkg-link-libs", tools = ["vcpkg_link_libs"] }
"gpp.runtime-stage" = { path = "../mcpp-build-scripts/runtime-stage", tools = ["runtime_stage"] }

[profile.release]
opt = 3
debug = true
lto = true

[profile.fast-release]
opt = 0
debug = true
lto = false

[build]
default-profile = "release"
sources = [
  "../3rdParty/3rdModule/boost.ixx",
  "../3rdParty/3rdModule/toml.ixx",
  "!x64/**",
  "!x86/**"
]
module_extensions = [".ixx"]

[target.windows.build]
defines = ["UNICODE", "_UNICODE", "_CRT_SECURE_NO_WARNINGS",
  "WIN32_LEAN_AND_MEAN", "NOMINMAX",
  "_RANGES_",
  "SPDLOG_WCHAR_FILENAMES"]
ldflags = ["-luser32", "-loleaut32"]

[targets.Updater]
kind = "bin"
main = "Updater.cpp"
windows_subsystem = "windows"

[resources]
files = ["Updater.rc"]
extra-inputs = ["Updater.manifest"]
