[package]
namespace = "gpp"
name = "build"
version = "1.0.0"
standard = "c++23"
license = "Apache-2.0"

[lib]
# mcpp 固定先编译 lib.path；这里选不依赖同包其他模块的工具模块。
path = "deps/tools.ixx"

[build]
sources = ["gpp-build.ixx", "deps/*.ixx"]
module_extensions = [".ixx"]

[build-dependencies]
# 将插件的宿主模块提供给使用 gpp.build 的构建脚本，各成员无需重复声明。
mcpp.plugins = { version = "0.15.1", features = ["deps", "rules-qt"], host-module = true, reexport = true }
