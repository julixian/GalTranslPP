[package]
namespace = "gpp"
name = "build"
version = "1.0.0"
standard = "c++23"
license = "LicenseRef-GalTranslPP"

[dependencies]
# 将插件依赖重新导出给使用 gpp.build 的构建脚本，各成员无需重复声明。
mcpp.plugins = { version = "0.18.1", features = ["deps"], reexport = true }
marzer.tomlplusplus = "3.4.0"

[features]
default = ["rules-qt"]

[features.rules-qt]
sources = ["rules/qt.ixx"]
rule_module = "gpp.rules.qt"
device_extensions = [".ui", ".qrc", ".ts"]

[lib]
path = "gpp-build.ixx"

[build]
sources = ["gpp-build.ixx", "deps/*.ixx"]
module_extensions = [".ixx"]
