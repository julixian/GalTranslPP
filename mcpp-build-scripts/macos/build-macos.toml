# macOS ARM64 便携版；本文件控制下载版本与独立检测，不改变 Windows 配置。
[tools]
mcpp = "2026.10.31.3"
llvm = "23.1.3"
qt = "6.12.0"
python_release = "20261013"
python = "3.12.15"
vcpkg = "434307da09bc05b2c86996dccc8b2351fc0d5d37"
sevenzip = "26.04"

[build]
profile = "release"
jobs = 3
deployment_target = "14.4"

[python]
# 基础检测先验证标准库、pip、扩展模块、中文路径和 multiprocessing。
# 可选功能分别安装到独立的随包 Python 副本，避免彼此依赖冲突污染发布包。
optional_dependencies = ["spacy", "stanza", "pkuseg", "babeldoc"]

[package]
name = "GalTranslPP-macos-arm64"
