[workspace]
members = ["GalTranslPP", "GPPVersion", "GPPCLI", "GPPGUI", "Updater"]

[workspace.package]
version = "3.2.1"
standard = "c++23"
license = "LicenseRef-GalTranslPP"

[toolchain]
windows = "llvm@22.1.8"

[workspace.build]
cxx_runtime = "host-coupled"
cxxflags = [
  "-finput-charset=UTF-8",
  "-fexec-charset=UTF-8"
]
defines = [
  "ABSL_CONSUME_DLL",
  "SPDLOG_COMPILED_LIB",
  "SPDLOG_SHARED_LIB",
  "FMT_SHARED",
  "PROJECT_NO_ANSI",
]
