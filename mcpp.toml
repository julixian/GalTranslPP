[workspace]
members = ["GalTranslPP", "GPPVersion", "GPPCLI", "GPPGUI", "Updater"]

[workspace.package]
version = "3.1.1"
standard = "c++23"
license = "MIT"

[toolchain]
windows = "llvm@22.1.8"

[workspace.build]
cxxflags = [
  "-finput-charset=UTF-8",
  "-fexec-charset=UTF-8"
]
defines = [
  "NOMINMAX",
  "_CRT_SECURE_NO_WARNINGS",
  "SPDLOG_COMPILED_LIB",
  "SPDLOG_WCHAR_FILENAMES",
  "_RANGES_"
]
dialect_cxxflags = ["-fms-runtime-lib=dll"]
